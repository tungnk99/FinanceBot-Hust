version: '3.8'

services:
  financebot:
    build: .
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONITORING_PROVIDER=${MONITORING_PROVIDER:-none}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - ENABLE_LANGFUSE=${ENABLE_LANGFUSE:-true}
      - ENABLE_LOGFIRE=${ENABLE_LOGFIRE:-false}
      - WANDB_PROJECT=${WANDB_PROJECT:-financebot-agents}
      - WANDB_API_KEY=${WANDB_API_KEY}
      - ENABLE_WANDB=${ENABLE_WANDB:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./app/.env:/financebot/app/.env
      - ./src:/financebot/src
    restart: unless-stopped
    networks:
      - financebot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  financebot-network:
    driver: bridge
