[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_libs"
version = "0.1.0"
description = "FinanceBot agent libraries"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "FinanceBot" }]

[tool.setuptools.packages.find]
include = ["agent_libs*"]

